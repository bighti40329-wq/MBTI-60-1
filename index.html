    class SoundEffectManager {
      constructor() {
        this.ctx = null;
        this.isMuted = localStorage.getItem("cognitype_muted") === "true";
      }
      init() {
        if (!this.ctx && typeof window !== "undefined") {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      }
      setMuted(muted) {
        this.isMuted = muted;
        localStorage.setItem("cognitype_muted", muted ? "true" : "false");
      }
      triggerHaptic(ms = 15) {
        if (typeof navigator !== "undefined" && navigator.vibrate) {
          try { navigator.vibrate(ms); } catch (e) {}
        }
      }
      playPop() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
          this.triggerHaptic(12);
        } catch (e) {}
      }
      playChime() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        try {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime + idx * 0.08;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
          });
          this.triggerHaptic(30);
        } catch (e) {}
      }
    }

          SN: { positive: 0, negative: 0 },
          TF: { positive: 0, negative: 0 },
          JP: { positive: 0, negative: 0 }
        };

        QUESTIONS.forEach(q => {
          const val = answers[q.id] || 3;
          const diff = val - 3;
          if (diff > 0) {
            if (q.target === q.dim[0]) dimScores[q.dim].positive += diff;
            else dimScores[q.dim].negative += diff;
          } else if (diff < 0) {
            const abs = Math.abs(diff);
            if (q.target === q.dim[0]) dimScores[q.dim].negative += abs;

            leftLetter,
            rightLetter,

            rightPct,
            winnerPct: winner === leftLetter ? leftPct : rightPct,
            wasBorderline: borderlineDims.includes(key)

        processDim("SN", "S", "N");

      const callGeminiFlash = async (prompt, systemInstruction, retryCount = 0) => {
        if (quotaState.isLocked) throw new Error("QUOTA_CIRCUIT_BREAKER_ACTIVE");
        if (!apiKey) throw new Error("NO_API_KEY");

        const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + apiKey;
        const payload = {
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.7, responseMimeType: "application/json" }
        };
        if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (response.status === 429) {
            updateQuota(0, true);
            throw new Error("HTTP_429_QUOTA_EXHAUSTED");
          }

          if ((response.status === 503 || !response.ok) && retryCount < 2) {
            const errJson = await response.json().catch(() => ({}));
            const msg = (errJson.error && errJson.error.message) || "";
            if (msg.includes("high demand") || response.status === 503) {
              await new Promise(res => setTimeout(res, 2000));
              return callGeminiFlash(prompt, systemInstruction, retryCount + 1);
            }
          }

          if (!response.ok) {
            const errJson = await response.json().catch(() => ({}));
            throw new Error((errJson.error && errJson.error.message) || ("API Error: " + response.status));
          }

          updateQuota(1, false);
          const data = await response.json();
          const text = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] ? data.candidates[0].content.parts[0].text : "{}";
          return JSON.parse(text);
        } catch (err) {
          throw err;
        }
      };

                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="text-base font-bold text-white">{item.type}</span>
                              <span className="text-xs text-sky-400 font-medium">{item.title}</span>
                              {idx === 0 && (
                                <span className="text-[10px] px-1.5 py-0.5 bg-emerald-500/20 text-emerald-300 rounded">最新</span>
                              )}
                            </div>
                            <span className="text-xs text-slate-500">{item.date}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <section className="mt-8 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 sm:p-5 text-xs text-slate-400">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-slate-300">🔑 Gemini API 金鑰自動保存：</span>
                  {keySavedBadge && <span className="text-emerald-400 font-semibold animate-pulse">✓ 已自動存檔</span>}
                </div>

                <div className="flex items-center space-x-3 text-[11px]">
                  <span>當月使用量：<strong className="text-sky-400">{quotaState.count}</strong> / {quotaState.limit} 次</span>
                  {quotaState.isLocked ? (
                    <span className="px-2 py-0.5 bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded font-bold">已熔斷鎖定</span>
                  ) : (
                    <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded font-bold">安全運作中</span>
                  )}
                  <button onClick={handleResetQuota} className="text-slate-500 hover:text-slate-300 underline">重置</button>
                </div>
              </div>

              <input
                type="password"
                placeholder="貼上你的 Gemini API Key（離開後自動儲存於此瀏覽器，永不外洩）"
                value={apiKey}
                onChange={e => handleKeyChange(e.target.value)}
                className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 font-mono text-xs"
              />
            </section>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
